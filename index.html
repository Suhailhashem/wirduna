<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#68734e">
  <meta name="description" content="وردنا، مساحة تجمع العائلة على قراءة القرآن ومتابعة الختمات.">
  <title>وردنا — ختمة تجمعنا</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
  <div class="demo-banner">نسخة قيد التجهيز · الحفظ على هذا الجهاز فقط</div>
  <div class="app">
    <header class="header"><a class="brand" href="#today"><span class="brand-mark">و</span><span>وردنا<small>ختمة تجمعنا</small></span></a><button id="settings" class="icon-button" aria-label="إدارة النسخة التجريبية"><svg><use href="#settings-icon"/></svg></button></header>
    <main id="main"></main>
    <footer class="footer">معًا، وجهًا بعد وجه <span>✦</span></footer>
  </div>
  <nav class="bottom-nav" aria-label="التنقل الرئيسي">
    <a href="#today" data-page="today"><svg><use href="#home-icon"/></svg><span>اليوم</span></a>
    <a href="#family" data-page="family"><svg><use href="#family-icon"/></svg><span>عائلتنا</span></a>
    <a href="#khatmas" data-page="khatmas"><svg><use href="#book-icon"/></svg><span>ختماتي</span></a>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="admin-dialog"><div class="dialog-head"><h2>إدارة النسخة التجريبية</h2><button id="close-admin" class="icon-button" aria-label="إغلاق">×</button></div><p class="muted">هذه مساحة تجربة محلية. لوحة الإدارة المحمية وربط العائلة يأتيان مع قاعدة البيانات.</p>
    <label for="person-select">تجربة صفحة أحد أفراد العائلة</label><select id="person-select"></select>
    <form id="add-person"><label for="person-name">إضافة اسم للتجربة</label><div class="inline-form"><input id="person-name" maxlength="40" required placeholder="الاسم"><button class="secondary" type="submit">إضافة</button></div></form>
    <form id="post-form"><label for="post-title">عنوان الوقفة</label><input id="post-title" required maxlength="80"><label for="post-body">الرسالة</label><textarea id="post-body" rows="4" maxlength="2000" required></textarea><label for="post-source">المصدر — اختياري</label><input id="post-source" maxlength="200"><button class="primary" type="submit">حفظ الوقفة</button></form>
  </dialog>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="home-icon" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="book-icon" viewBox="0 0 24 24"><path d="M12 5c-3-2-7-2-10-1v16c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-7-1-10 1Zm0 0v16"/></symbol>
    <symbol id="family-icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M2 21v-3a6 6 0 0 1 12 0v3M16 3a4 4 0 0 1 0 8m2 4a5 5 0 0 1 4 4v2"/></symbol>
    <symbol id="settings-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></symbol>
    <symbol id="spark-icon" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM21 2v4m-2-2h4"/></symbol>
  </defs></svg>
  <script type="module" src="./app.js?v=3"></script>
</body></html>
